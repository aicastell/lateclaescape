{{ define "main" }}

{{ $data := .Data }}

<div class="container" role="main">
  <div class="col-lg-8 offset-lg-2 col-md-10 offset-md-1">
    <article class="post-preview">
      <div class="accordion" id="accordion">
        {{ range $key, $value := .Data.Terms.ByCount }}
            <div class="accordion-item">
              <h2 class="accordion-header" id="headingOne">

                <button class="accordion-button collapsed"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#collapse{{ $value.Name }}">

  <span class="d-flex justify-content-between align-items-center w-100 me-3">
    <span class="fs-5">{{ $value.Name }}</span>
    <span class="small text-body-secondary text-end">
      {{ $value.Count }}
    </span>
  </span>

</button>




              </h2>
              <div id="collapse{{ $value.Name }}" class="accordion-collapse collapse">
                <div class="accordion-body">
                  <a href="{{ $.Site.LanguagePrefix | absURL }}/{{ $data.Plural }}/{{ $value.Name | urlize }}/" class="post-title list-group-item view-all">View all</a>
                  <div class="list-group">
                    {{ range $item := $value.WeightedPages }}
                    <a href="{{$item.Permalink}}" class="list-group-item">{{ $item.Title }}</a>
                    {{ end }}
                  </div>
                </div>
              </div>
            </div>
        {{ end }}
      </div>
    </article>
  </div>
</div>


{{ end }}
